spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/newtonops}
    username: ${DATABASE_USER:newtonops}
    password: ${DATABASE_PASSWORD:newtonops_dev}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
newtonops:
  seed: ${DEMO_SEED:true}
logging:
  structured:
    format:
      console: ecs
