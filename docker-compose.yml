services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newtonops
      POSTGRES_USER: newtonops
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-newtonops_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U newtonops -d newtonops']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/newtonops
      DATABASE_USER: newtonops
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-newtonops_dev}
      DEMO_SEED: ${DEMO_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:8088:80'
    depends_on:
      - backend
volumes:
  postgres_data:
